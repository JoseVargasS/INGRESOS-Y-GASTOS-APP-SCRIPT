  function isChartBarDataset(chart, dataset) {
    return (
      dataset.type === "bar" || (!dataset.type && chart.config.type === "bar")
    );
  }

  function getChartLabelLane(chart, datasetIndex) {
    const barIndexes = chart.data.datasets
      .map((dataset, index) => ({ dataset, index }))
      .filter(
        ({ dataset, index }) =>
          isChartBarDataset(chart, dataset) &&
          !chart.getDatasetMeta(index).hidden,
      )
      .map(({ index }) => index);
    const laneIndex = Math.max(0, barIndexes.indexOf(datasetIndex));
    const center = (barIndexes.length - 1) / 2;

    return {
      offset: 10 + laneIndex * 9,
      xShift: (laneIndex - center) * 12,
    };
  }

  const chartLabelGuidePlugin = {
    id: "chartLabelGuidePlugin",
    afterDatasetsDraw(chart, args, opts) {
      if (!opts || !opts.enabled) return;
      const { ctx } = chart;
      const color = opts.color || "rgba(255,255,255,0.45)";
      const labelBg = opts.labelBg || "rgba(2,4,3,0.78)";
      const labelBorder = opts.labelBorder || "rgba(255,255,255,0.10)";
      const labelColor = opts.labelColor || "#f7f8f4";
      const paddingX = 5;
      const placed = [];

      function roundRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      function intersects(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      ctx.save();
      ctx.font = opts.font || "550 11px Segoe UI, Arial, sans-serif";
      ctx.textBaseline = "middle";

      chart.data.datasets.forEach((dataset, datasetIndex) => {
        const meta = chart.getDatasetMeta(datasetIndex);
        if (!meta || meta.hidden) return;
        if (!isChartBarDataset(chart, dataset)) return;

        meta.data.forEach((element, dataIndex) => {
          const rawValue = Number(dataset.data[dataIndex]) || 0;
          if (!rawValue) return;

          const point = element.tooltipPosition
            ? element.tooltipPosition()
            : element.getProps(["x", "y"], true);
          const props = element.getProps(["x", "y", "base"], true);
          const startX = props.x || point.x;
          const startY = props.y || point.y;
          const direction = rawValue >= 0 ? -1 : 1;
          const lane = getChartLabelLane(chart, datasetIndex);
          const text = `${rawValue < 0 ? "-" : ""}S/${Math.abs(rawValue).toFixed(0)}`;
          const textW = ctx.measureText(text).width;
          const boxW = textW + paddingX * 2;
          const boxH = 18;
          let boxX = startX - boxW / 2 + lane.xShift;
          let boxY = startY + direction * lane.offset - boxH / 2;
          const minX = chart.chartArea.left + 2;
          const maxX = chart.chartArea.right - boxW - 2;
          const minY = chart.chartArea.top + 2;
          const maxY = chart.chartArea.bottom - boxH - 2;
          boxX = Math.max(minX, Math.min(maxX, boxX));
          boxY = Math.max(minY, Math.min(maxY, boxY));

          let box = { x: boxX, y: boxY, w: boxW, h: boxH };
          let guard = 0;
          while (placed.some((prev) => intersects(box, prev)) && guard < 12) {
            const nextY = Math.max(
              minY,
              Math.min(maxY, box.y + direction * (boxH + 2)),
            );
            if (nextY === box.y) {
              const side = guard % 2 === 0 ? 1 : -1;
              box.x = Math.max(minX, Math.min(maxX, box.x + side * (boxW + 6)));
            } else {
              box.y = nextY;
            }
            guard++;
          }
          placed.push(box);

          const boxCenterY = box.y + box.h / 2;
          const boxEdgeX = startX <= box.x + box.w / 2 ? box.x : box.x + box.w;
          const elbowY = startY + direction * (opts.elbowLength || 6);

          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.setLineDash([]);
          ctx.moveTo(startX, startY);
          ctx.lineTo(startX, elbowY);
          ctx.lineTo(boxEdgeX, boxCenterY);
          ctx.stroke();

          roundRect(box.x, box.y, box.w, box.h, 3);
          ctx.fillStyle = labelBg;
          ctx.fill();
          ctx.strokeStyle = labelBorder;
          ctx.stroke();
          ctx.fillStyle = labelColor;
          ctx.fillText(text, box.x + paddingX, boxCenterY);
        });
      });

      ctx.restore();
    },
  };

  /**
   * Mapa de meses en español a índices (0-11)
   */
  const SPANISH_MONTHS_MAP = {
    ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5,
    jul: 6, ago: 7, sep: 8, oct: 9, nov: 10, dic: 11,
  };

  /**
   * Convierte una fecha a formato YYYY-MM-DD
   * @param {Date|string} date - Fecha como Date o ISO string
   * @returns {string} Fecha en formato YYYY-MM-DD
   */
  function formatDateToISO(date) {
    const d = date instanceof Date ? date : new Date(date);
    if (isNaN(d.getTime())) return "";
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  }

  /**
   * Convierte una fecha en formato "28-feb-26" a objeto Date
   * @param {string} dateStr - Fecha en formato "dd-mmm-yy"
   * @returns {Date|null} Objeto Date o null si no es válido
   */
  function parseSpanishDate(dateStr) {
    if (!dateStr) return null;
    const parts = dateStr.split("-");
    if (parts.length !== 3) return null;

    const mIndex = SPANISH_MONTHS_MAP[parts[1].toLowerCase()];
    if (mIndex === undefined) return null;

    let yr = parseInt(parts[2]);
    if (yr < 100) yr += 2000;

    return new Date(yr, mIndex, parseInt(parts[0]));
  }

  /**
   * Convierte una transacción eliminada a formato de fecha para el servidor
   * @param {Object} transaction - Transacción con rawDate o date
   * @returns {string} Fecha en formato YYYY-MM-DD
   */
  function transactionDateToISO(transaction) {
    if (transaction.rawDate) {
      return formatDateToISO(transaction.rawDate);
    }
    if (transaction.date) {
      const d = parseSpanishDate(transaction.date);
      return d ? formatDateToISO(d) : "";
    }
    return "";
  }

  function buildSkeletonRows(rows, widths, className = "") {
    return Array.from(
      { length: rows },
      () => `
    <tr class="skeleton-tr ${className}">
      ${widths
        .map(
          (width) => `
        <td>
          <div class="shimmer skeleton-row" style="--skeleton-width:${width};"></div>
        </td>
      `,
        )
        .join("")}
    </tr>
  `,
    ).join("");
  }

  function setValueSkeleton(ids, className = "skeleton-text") {
    ids.forEach((id) => {
      const el = document.getElementById(id);

  function showToast(message, type = "info", title = "") {
    const container = document.getElementById("toastContainer");

    const icons = {
      success: "fa-check-circle",
      error: "fa-exclamation-circle",
      info: "fa-info-circle",
    };

    const titles = {
      success: title || "Éxito",
      error: title || "Error",
      info: title || "Información",
    };

    const toast = document.createElement("div");
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
    <div class="toast-icon">
      <i class="fa-solid ${icons[type]}"></i>
    </div>
    <div class="toast-content">
      <div class="toast-title">${titles[type]}</div>
      <div class="toast-message">${message}</div>
    </div>
    <button class="toast-close" onclick="this.parentElement.remove()">
      <i class="fa-solid fa-times"></i>
    </button>
  `;

    container.appendChild(toast);

    // Auto-remove after 4 seconds
    setTimeout(() => {
      toast.classList.add("hiding");
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

    // ============================================
    const customKeyboard = document.getElementById("custom-calc-keyboard");

    inputAmount.addEventListener("focus", () => {
      if (window.innerWidth <= 768) {
        document.body.classList.add("keyboard-active");
        customKeyboard.classList.remove("hidden");

        // Integración con Back Button (History API)
        if (window.history.state?.keyboardOpen !== true) {
          window.history.pushState({ keyboardOpen: true }, "");
        }

        // Asegurar que el input sea visible después de que el teclado aparezca
        setTimeout(() => {
          inputAmount.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 300);
      }
    });

    inputAmount.addEventListener("blur", () => {
      // Pequeño delay para dejar que terminen las transiciones
      setTimeout(() => {
        document.body.classList.remove("keyboard-active");
        customKeyboard.classList.add("hidden");

        // Si el blur fue manual (Hecho o clic fuera) y el estado sigue siendo de teclado abierto, limpiar historial
        if (window.history.state?.keyboardOpen === true) {
          window.history.back();
        }
      }, 150);
    });

    // Manejar el botón de atrás del sistema/navegador
    window.addEventListener("popstate", (event) => {
      const isKeyboardOpen = !customKeyboard.classList.contains("hidden");
      if (
        isKeyboardOpen &&
        (!event.state || event.state.keyboardOpen !== true)
      ) {
        inputAmount.blur(); // El blur disparará el ocultamiento y la limpieza de clases
      }
    });

    // Prevenir que el input pierda el foco al tocar los botones del teclado custom
    customKeyboard.addEventListener("mousedown", (e) => {
      if (e.target.closest(".kb-btn")) {
        e.preventDefault(); // Mantiene el foco en el inputAmount
      }
    });

    // Soporte para touch
    customKeyboard.addEventListener(
      "touchstart",
      (e) => {
        if (e.target.closest(".kb-btn")) {
          // No preventDefault aquí para permitir el click, pero el mousedown se encargará del foco
        }
      },
      { passive: true },
    );
  }

  // ============================================
  // CUSTOM DROPDOWN
  // ============================================
  function setupCustomDropdown() {
    const dropdown = document.getElementById("typeDropdown");
    const selectedEl = document.getElementById("dropdownSelected");
    const optionsContainer = document.getElementById("dropdownOptions");
    const hiddenInput = document.getElementById("inputType");
    const selectedText = document.getElementById("selectedText");
    const selectedDot = document.getElementById("selectedDot");

    const options = [
      {
        val: "GASTO NO FRECUENTE",
        label: "Gasto No Frecuente",
        color: "dot-yellow",
      },
      { val: "GASTO FRECUENTE", label: "Gasto Frecuente", color: "dot-red" },
      {
        val: "INGRESO NO FRECUENTE",
        label: "Ingreso No Frecuente",
        color: "dot-green",
      },
    ];

    optionsContainer.innerHTML = "";
    options.forEach((opt) => {
      const div = document.createElement("div");
      // AGREGADO: Clase específica para sombra/color
      div.className = `dropdown-option opt-${opt.val.toLowerCase().replace(/\s+/g, "-")}`;
      div.dataset.value = opt.val;
      div.innerHTML = `<span class="dot-indicator ${opt.color}"></span> ${opt.label}`;
      div.addEventListener("click", () => selectOption(opt));
      optionsContainer.appendChild(div);
    });

    selectedEl.addEventListener("click", (e) => {
      e.stopPropagation();
      const isHidden = optionsContainer.classList.contains("hidden");

      // Close all other dropdowns
      document
        .querySelectorAll(".dropdown-options")
        .forEach((el) => el.classList.add("hidden"));
      document
        .querySelectorAll(".dropdown-selected")
        .forEach((el) => el.classList.remove("active"));

      if (isHidden) {
        optionsContainer.classList.remove("hidden");
        selectedEl.classList.add("active");
      } else {
        optionsContainer.classList.add("hidden");
        selectedEl.classList.remove("active");
      }
    });

    window.selectOption = function (optObj) {
      hiddenInput.value = optObj.val;
      selectedText.textContent = optObj.label;
      selectedDot.className = "dot-indicator " + optObj.color;

      // Update visual selection
      document.querySelectorAll(".dropdown-option").forEach((el) => {
        el.classList.toggle("selected", el.dataset.value === optObj.val);
      });

      optionsContainer.classList.add("hidden");
      selectedEl.classList.remove("active");
    };

    const initial =
      options.find((o) => o.val === hiddenInput.value) || options[0];
    selectOption(initial);

    window.setDropdownValue = function (val) {
      const found = options.find((o) => o.val === val);
      if (found) selectOption(found);
    };
  }

    const mobileSelect = document.getElementById("yearSelectMobile");

      currentYr,
      currentYr - 1,
      currentYr - 2,
      currentYr - 3,

    years.forEach((y) => {
      const div = document.createElement("div");
      div.className = "dropdown-option";
      div.innerHTML = `<span>${y}</span> <i class="fa-solid fa-check year-option-check" style="opacity: ${currentYear === y ? 1 : 0};"></i>`;

      div.addEventListener("click", () => {
        updateYearUI(y);

      mobileSelect.innerHTML = "";

        option.textContent = y;
        if (y === currentYear) option.selected = true;

        optionsContainer.classList.remove("hidden");
        head.classList.add("active");

        optionsContainer.classList.add("hidden");
        head.classList.remove("active");

      if (!wrapper.contains(e.target)) {
        optionsContainer.classList.add("hidden");
        head.classList.remove("active");

  function updateQuickMonthAvailability() {
    const now = new Date();
    quickMonthChips.forEach((chip) => {
      const month = parseInt(chip.getAttribute("data-month"));
      const isFuture = currentYear > now.getFullYear() ||
        (currentYear === now.getFullYear() && month > now.getMonth());
      chip.disabled = isFuture;
      chip.title = isFuture ? "Este mes aún no está disponible" : "";
    });
  }

    currentMonthDisplay.textContent = monthNames[currentMonth];
    if (currentMonthDisplayMobile)
      currentMonthDisplayMobile.textContent = monthNames[currentMonth];
    document.getElementById("pageSubtitle").textContent =
      monthNames[currentMonth] + " " + currentYear;

    quickMonthChips.forEach((chip) => {
      chip.classList.toggle(
        "active",
        parseInt(chip.getAttribute("data-month")) === currentMonth,
      );
    });

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
      updateYearUI(currentYear);
      if (yearSelectMobile) yearSelectMobile.value = currentYear;
    } else if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
      updateYearUI(currentYear);
      if (yearSelectMobile) yearSelectMobile.value = currentYear;
    }
    updateHeaderDate();
    loadTransactions();
  }

  function addMathSymbol(symbol) {
    // Opt 5: usar inputAmount cacheado en lugar de getElementById
    const start = inputAmount.selectionStart;
    const end = inputAmount.selectionEnd;
    const text = inputAmount.value;

    // Insert symbol at cursor position
    inputAmount.value = text.substring(0, start) + symbol + text.substring(end);

    // Move cursor to after the inserted symbol
    const newPos = start + symbol.length;
    inputAmount.setSelectionRange(newPos, newPos);

    // Trigger input event for preview
    inputAmount.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function clearAmount() {
    // Opt 5: usar inputAmount cacheado
    inputAmount.value = "";
    inputAmount.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function deleteLastChar() {
    // Opt 5: usar inputAmount cacheado
    const start = inputAmount.selectionStart;
    const end = inputAmount.selectionEnd;
    const text = inputAmount.value;

    if (start === end) {
      if (start > 0) {
        inputAmount.value = text.substring(0, start - 1) + text.substring(end);
        inputAmount.setSelectionRange(start - 1, start - 1);
      }
    } else {
      inputAmount.value = text.substring(0, start) + text.substring(end);
      inputAmount.setSelectionRange(start, start);
    }
    inputAmount.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function blurAmount() {
    // Opt 5: usar inputAmount cacheado
    inputAmount.blur();
  }

  function calculateExpression(expression) {
    if (!expression) return 0;
    // Opt 12: fast path para números simples sin operadores
    if (/^-?\d+(\.\d+)?$/.test(expression.trim())) {
      return parseFloat(expression);
    }
    const cleanExpr = expression.replace(/[^0-9+\-*/.()]/g, "");
    // Si después de limpiar no queda nada, no es una expresión válida
    if (!cleanExpr) return null;
    try {
      return new Function("return " + cleanExpr)();
    } catch (e) {
      return null;
    }
  }

  function formatMoney(val) {
    if (!val) return "S/ 0.00";
    const num = Number(val);
    if (isNaN(num)) return val;
    const prefix = num >= 0 ? "S/ " : "-S/ ";
    return prefix + Math.abs(num).toFixed(2);
  }

  function abbreviateType(type) {
    // Opt 6: usar mapa global precalculado
    if (!type) return "";
    return ABBREVIATE_TYPE_MAP[type] || type;
  }

  // ============================================
  // SORTING
  // ============================================
  function sortAndRender() {
    if (!transactionCache) return;

    transactionCache.sort((a, b) => {
      let valA, valB;

      if (currentSort.col === "date") {
        valA = new Date(a.rawDate).getTime();
        valB = new Date(b.rawDate).getTime();
      } else if (currentSort.col === "amount") {
        valA = parseFloat(a.amount);
        valB = parseFloat(b.amount);
      } else if (currentSort.col === "type") {
        valA = a.type.toLowerCase();
        valB = b.type.toLowerCase();
      } else if (currentSort.col === "detail") {
        valA = a.detail.toLowerCase();
        valB = b.detail.toLowerCase();
      }

      if (valA < valB) return currentSort.order === "asc" ? -1 : 1;
      if (valA > valB) return currentSort.order === "asc" ? 1 : -1;
      return 0;
    });

    document
      .querySelectorAll("th i")
      .forEach((icon) => (icon.className = "fa-solid fa-sort"));
    const activeTh = document.querySelector(
      `th[data-sort="${currentSort.col}"]`,
    );
    if (activeTh) {
      const icon = activeTh.querySelector("i");
      if (icon) {
        icon.className = `fa-solid fa-sort-${currentSort.order === "asc" ? "up" : "down"}`;
      }
    }

    renderTransactions(transactionCache, false);
  }

  function renderTransactions(data, updateCache = true) {
    if (updateCache) transactionCache = data;

    if (updateCache) {
      sortAndRender();
      return;
    }

    const tbody = document.getElementById("transactionsTableBody");
    tbody.innerHTML = "";

    let totalIncome = 0;
    let totalExpense = 0;
    let freqExpense = 0;
    let noFreqExpense = 0;
    let noFreqIncome = 0;

    // Filtrar 'INGRESO FRECUENTE' de la tabla para no mostrarlo
    const filteredData = data.filter((t) => t.type !== "INGRESO FRECUENTE");

    if (!filteredData || filteredData.length === 0) {
      tbody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center; padding: 40px; color: var(--text-secondary);">
          <i class="fa-solid fa-inbox" style="font-size: 32px; margin-bottom: 15px; opacity: 0.5;"></i><br>
          No hay movimientos en este mes
        </td>
      </tr>
    `;
      updateHeaderStats(0, 0, 0, 0, 0);
      return;
    }

    const fragment = document.createDocumentFragment();

    filteredData.forEach((tx) => {
      const amt = Number(tx.amount);
      if (amt > 0) {
        totalIncome += amt;
        noFreqIncome += amt;
      } else {
        totalExpense += amt;
        if (tx.type === "GASTO FRECUENTE") freqExpense += amt;
        else noFreqExpense += amt;
      }

      const row = document.createElement("tr");
      row.className = "fade-in";

      // CORRECCIÓN: Sombreado para todos los tipos
      if (tx.type === "GASTO FRECUENTE") {
        row.classList.add("row-gasto-frecuente");
      } else if (tx.type === "GASTO NO FRECUENTE") {
        row.classList.add("row-gasto-no-frecuente");
      } else if (tx.type === "INGRESO FRECUENTE") {
        row.classList.add("row-ingreso-frecuente");
      } else if (tx.type === "INGRESO NO FRECUENTE") {
        row.classList.add("row-ingreso-no-frecuente");
      }

      let amountClass = "";
      if (amt >= 0) {
        amountClass = "amount-positive";
      } else {
        amountClass =
          tx.type === "GASTO FRECUENTE" ? "amount-negative" : "amount-neutral";
      }

      let typePillClass = "pill-neutral";
      if (tx.type === "GASTO FRECUENTE") typePillClass = "pill-red";
      if (tx.type === "INGRESO NO FRECUENTE") typePillClass = "pill-green";

      const detailText = tx.detail || "";
      const detailHtml = `
      <div class="detail-wrapper">
        <div class="detail-content check-overflow" id="detail-${tx.rowId}">
          ${isSearchActive && searchText ? highlightSearchMatch(detailText, searchText) : escapeHtml(detailText)}
        </div>
        <button class="detail-expand-btn" type="button" data-detail-id="${tx.rowId}" onclick="toggleDetailExpansion(event, ${tx.rowId})" title="Ver detalle completo" aria-label="Ver detalle completo">+</button>
      </div>
    `;

      row.innerHTML = `
      <td style="white-space: nowrap;">
        <i class="fa-solid fa-grip-lines drag-handle"></i>
        ${tx.date}
      </td>
      <td class="${amountClass}">${amt >= 0 ? "+ S/ " : "- S/ "} ${Math.abs(amt).toFixed(2)}</td>
      <td>${detailHtml}</td>
      <td><span class="${typePillClass}">${isSearchActive && searchText ? highlightSearchMatch(abbreviateType(tx.type), searchText) : abbreviateType(tx.type)}</span></td>
      <td>
        <div class="action-buttons-wrapper">
          <button class="action-btn edit" onclick="startEdit(${tx.rowId})" title="Editar">
            <i class="fa-solid fa-pencil"></i>
          </button>
          <button class="action-btn delete" onclick="showDeleteModal(${tx.rowId})" title="Eliminar">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </td>
    `;

      // Add Drag & Drop attributes
      row.draggable = true;
      row.dataset.rowId = tx.rowId;
      row.addEventListener("click", (event) => {
        if (event.target.closest(".action-buttons-wrapper, .drag-handle")) return;
        openTransactionDetail(tx);
      });
      row.addEventListener("dragstart", handleDragStart);
      row.addEventListener("dragover", handleDragOver);
      row.addEventListener("dragleave", handleDragLeave);
      row.addEventListener("drop", handleDrop);
      row.addEventListener("dragend", handleDragEnd);

      // Add lifting visual feedback listeners
      const handle = row.querySelector(".drag-handle");
      if (handle) {
        const lift = () => row.classList.add("drag-lifted");
        const dropLift = () => row.classList.remove("drag-lifted");
        handle.addEventListener("mousedown", lift);
        handle.addEventListener("touchstart", lift, { passive: true });
        row.addEventListener("mouseup", dropLift);
        row.addEventListener("touchend", dropLift);
        row.addEventListener("dragend", dropLift);
      }

      fragment.appendChild(row);
    });

    tbody.appendChild(fragment);

    updateHeaderStats(
      totalIncome,
      totalExpense,
      freqExpense,
      noFreqExpense,
      noFreqIncome,
    );
    setTimeout(checkDetailOverflows, 0);
  }

  function updateHeaderStats(income, expense, freqExp, noFreqExp, noFreqInc) {
    // Extraer el Ingreso Frecuente directamente del objeto 'summaries'
    let freqInc = 0;
    const currMonthYearStr = monthNames[currentMonth] + " " + currentYear;
    if (summaries && summaries.length > 0) {
      const summaryRow = summaries.find(
        (s) => s.monthYear === currMonthYearStr,
      );
      if (summaryRow) {
        freqInc = Number(summaryRow.freqIncome) || 0;
      }
    }

    // Sumar a los totales
    const finalIncome = Number(income) + freqInc;
    let balance = finalIncome + Number(expense);

    // Opt 9: usar elementos cacheados + Opt 11: textContent en lugar de innerText
    if (elStatFreqIncome) elStatFreqIncome.textContent = "+ S/ " + freqInc.toFixed(2);
    if (elStatNoFreqIncome)
      elStatNoFreqIncome.textContent = "+ S/ " + Math.abs(noFreqInc).toFixed(2);
    if (elStatFreqExpense) elStatFreqExpense.textContent = "- S/ " + Math.abs(freqExp).toFixed(2);
    if (elStatNoFreqExpense)
      elStatNoFreqExpense.textContent = "- S/ " + Math.abs(noFreqExp).toFixed(2);
    if (elStatTotalExpense)
      elStatTotalExpense.textContent = "- S/ " + Math.abs(expense).toFixed(2);
    if (elStatBalance)
      elStatBalance.textContent =
        (balance >= 0 ? "+ S/ " : "- S/ ") + Math.abs(balance).toFixed(2);
  }

  /**
   * Recalcula y actualiza los stats del header desde transactionCache
   * sin re-renderizar la tabla (evita parpadeo al editar)
   */
  function refreshHeaderStatsFromCache() {
    if (!transactionCache || transactionCache.length === 0) {
      updateHeaderStats(0, 0, 0, 0, 0);
      return;
    }

    let totalIncome = 0, totalExpense = 0, freqExpense = 0, noFreqExpense = 0, noFreqIncome = 0;
    transactionCache.forEach((tx) => {
      if (tx.type === "INGRESO FRECUENTE") return; // Excluir como en renderTransactions
      const amt = Number(tx.amount);
      if (amt > 0) {
        totalIncome += amt;
        noFreqIncome += amt;
      } else {
        totalExpense += amt;
        if (tx.type === "GASTO FRECUENTE") freqExpense += amt;
        else noFreqExpense += amt;
      }
    });

    updateHeaderStats(totalIncome, totalExpense, freqExpense, noFreqExpense, noFreqIncome);
  }

  function escapeHtml(text) {
    // Opt 2: reutilizar elemento temporal en lugar de crear uno nuevo
    _escapeDiv.textContent = text;
    return _escapeDiv.innerHTML;
  }

  /**
   * Resalta las coincidencias de búsqueda en un texto
   * @param {string} text - Texto donde buscar
   * @param {string} searchTerm - Término a resaltar
   * @returns {string} HTML con las coincidencias resaltadas
   */
  function highlightSearchMatch(text, searchTerm) {
    if (!searchTerm || !text) return escapeHtml(text);
    
    const escapedText = escapeHtml(text);
    const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // Escapar caracteres especiales de regex
    const regex = new RegExp(`(${escapedTerm})`, 'gi');
    
    return escapedText.replace(regex, '<mark class="search-highlight">$1</mark>');
  }

  window.checkDetailOverflows = function () {
    document.querySelectorAll(".detail-content").forEach((content) => {
      const isExpanded = content.classList.contains("is-expanded");
      const isOverflowing = !isExpanded && content.scrollWidth > content.clientWidth + 1;
      content.classList.toggle("is-overflowing", isOverflowing);
      const button = content.parentElement.querySelector(".detail-expand-btn");
      if (button) button.classList.toggle("visible", isOverflowing || isExpanded);
    });

  window.toggleDetailExpansion = function (event, rowId) {
    event.stopPropagation();
    const content = document.getElementById(`detail-${rowId}`);
    if (!content) return;
    clearTimeout(content._detailCollapseTimer);
    const isExpanded = !content.classList.contains("is-expanded");
    if (isExpanded) {
      content.style.maxHeight = `${content.offsetHeight}px`;
      content.classList.add("is-expanded");
      content.classList.remove("is-overflowing");
      const expandedHeight = content.scrollHeight;
      requestAnimationFrame(() => {
        content.style.maxHeight = `${expandedHeight}px`;
      });
    } else {
      content.style.maxHeight = `${content.scrollHeight}px`;
      content.getBoundingClientRect();
      content.style.maxHeight = "26px";
      content._detailCollapseTimer = setTimeout(() => {
        content.classList.remove("is-expanded");
        content.style.maxHeight = "";
        checkDetailOverflows();
      }, 270);
    }
    const button = content.parentElement.querySelector(".detail-expand-btn");
    if (button) {
      button.textContent = isExpanded ? "−" : "+";
      button.title = isExpanded ? "Ocultar detalle completo" : "Ver detalle completo";

    return date.toLocaleTimeString("es-PE", {

  function applyExportDateBounds(bounds) {
    exportDateBounds = bounds || { minDate: "", maxDate: "" };
    const minDate = exportDateBounds.minDate || "";
    const minMonth = minDate ? minDate.slice(0, 7) : "";
    const dateInputs = [
      document.getElementById("exportStartDate"),
      document.getElementById("exportEndDate"),
    ];
    const monthInputs = [
      document.getElementById("exportStartMonth"),
      document.getElementById("exportEndMonth"),
    ];

    dateInputs.forEach((input) => {
      input.min = minDate;
    });
    monthInputs.forEach((input) => {
      input.min = minMonth;
    });

    const startDateInput = dateInputs[0];
    const startMonthInput = monthInputs[0];
    if (minDate && startDateInput.value < minDate) startDateInput.value = minDate;
    if (minMonth && startMonthInput.value < minMonth) startMonthInput.value = minMonth;
  }

  function loadExportDateBounds() {
    google.script.run
      .withSuccessHandler(applyExportDateBounds)

  function getSelectedExportRange() {
    if (exportRangeMode === "months") {
      const startMonth = document.getElementById("exportStartMonth").value;
      const endMonth = document.getElementById("exportEndMonth").value;
      if (!startMonth || !endMonth) return null;
      const [endYear, endMonthNumber] = endMonth.split("-").map(Number);
      return {
        startDate: `${startMonth}-01`,
        endDate: formatDateToISO(new Date(endYear, endMonthNumber, 0)),
      };

      startDate: document.getElementById("exportStartDate").value,
      endDate: document.getElementById("exportEndDate").value,

  function submitExportRange(event) {
    event.preventDefault();
    const range = getSelectedExportRange();
    if (!range || !range.startDate || !range.endDate) {
      showToast("Selecciona el rango que deseas exportar", "info");
      return;
    }
    if (range.startDate > range.endDate) {
      showToast("La fecha inicial no puede ser posterior a la fecha final", "error");
      return;
    }
    const isBeforeFirstRecord = exportRangeMode === "months"
      ? exportDateBounds.minDate && range.startDate.slice(0, 7) < exportDateBounds.minDate.slice(0, 7)
      : exportDateBounds.minDate && range.startDate < exportDateBounds.minDate;
    if (isBeforeFirstRecord) {
      showToast(`La exportación debe iniciar desde ${exportDateBounds.minDate} o una fecha posterior`, "info");
      return;
    }

    const button = document.getElementById("btnConfirmExport");
    const originalHtml = button.innerHTML;
    button.disabled = true;
    button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Preparando...';

    google.script.run
      .withSuccessHandler((transactions) => {
        button.disabled = false;
        button.innerHTML = originalHtml;
        closeExportDialog();
        if (pendingExportFormat === "pdf") {
          exportTransactionsToPdf(transactions, range);
        } else {
          exportTransactionsToExcel(transactions, range);
        }
      })
      .withFailureHandler((error) => {
        button.disabled = false;
        button.innerHTML = originalHtml;
        showToast("Error al preparar la exportación: " + error.message, "error");
      })
      .getTransactionsForExport(range.startDate, range.endDate);
  }

  function exportTransactionsToExcel(transactions, range) {
    const rows = getExportRows(transactions);
    if (!rows.length) {
      showToast("No hay datos para exportar", "info");
      return;
    }
    if (typeof XLSX === "undefined") {
      showToast("No se pudo cargar el exportador de Excel", "error");
      return;
    }

    const worksheet = XLSX.utils.json_to_sheet(rows);
    worksheet["!cols"] = [
      { wch: 14 },
      { wch: 18 },
      { wch: 14 },
      { wch: 42 },
      { wch: 24 },
    ];
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Movimientos");
    XLSX.writeFile(workbook, getExportFileName("xlsx", range.startDate, range.endDate));
    showToast("Excel exportado correctamente", "success");
  }

  function exportTransactionsToPdf(transactions, range) {
    const rows = getExportRows(transactions);
    if (!rows.length) {
      showToast("No hay datos para exportar", "info");
      return;
    }
    if (!window.jspdf || !window.jspdf.jsPDF) {
      showToast("No se pudo cargar el exportador de PDF", "error");
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape" });
    doc.setFontSize(16);
    doc.text("Bucks Manager - Movimientos", 14, 16);
    doc.setFontSize(10);
    doc.text(`Del ${range.startDate} al ${range.endDate}`, 14, 23);
    doc.autoTable({
      startY: 29,
      head: [["Fecha", "Hora", "Monto", "Detalle", "Tipo"]],
      body: rows.map((row) => [
        row.Fecha,
        row.Hora,
        `S/ ${row.Monto.toFixed(2)}`,
        row.Detalle,
        row.Tipo,
      ]),
      styles: { fontSize: 8, cellPadding: 2.5 },
      headStyles: { fillColor: [25, 35, 45] },
      columnStyles: { 3: { cellWidth: 105 } },
    });
    doc.save(getExportFileName("pdf", range.startDate, range.endDate));
    showToast("PDF exportado correctamente", "success");
  }

  // ============================================
  // DRAG & DROP LOGIC
  // ============================================
  let dragSrcEl = null;

  function handleDragStart(e) {
    if (e.target.tagName.toLowerCase() !== "tr") return;
    dragSrcEl = e.target;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", e.target.dataset.rowId);
    setTimeout(() => {
      e.target.classList.remove("drag-lifted");
      e.target.classList.add("dragging");
    }, 50);
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (dragSrcEl !== this) {
      // Opt 1: solo quitar clase de la fila anterior en lugar de querySelectorAll
      if (currentDragOverRow && currentDragOverRow !== this) {
        currentDragOverRow.classList.remove("drag-over");
      }
      this.classList.add("drag-over");
      currentDragOverRow = this;
    }
    return false;
  }

  function handleDragLeave(e) {
    this.classList.remove("drag-over");
  }

  function handleDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    this.classList.remove("drag-over");
    currentDragOverRow = null; // Opt 1: limpiar referencia

    if (dragSrcEl !== this) {
      const srcRowId = dragSrcEl.dataset.rowId;
      const targetRowId = this.dataset.rowId;

      // Swap contents in DOM instantly
      const srcHTML = dragSrcEl.innerHTML;
      dragSrcEl.innerHTML = this.innerHTML;
      this.innerHTML = srcHTML;

      // Swap dataset row IDs
      dragSrcEl.dataset.rowId = targetRowId;
      this.dataset.rowId = srcRowId;

      // Background update Google Script (Silently, no visual reload on success)
      google.script.run
        .withFailureHandler((err) => {
          showToast("Error moviendo celda: " + err.message, "error");
          loadTransactions();
        })
        .swapTransactions(srcRowId, targetRowId);
    }
    return false;
  }

  function handleDragEnd(e) {
    e.target.classList.remove("dragging");
    currentDragOverRow = null; // Opt 1: limpiar referencia
  }

  function confirmDelete(rowId) {
    const btn = document.querySelector(
      `button[onclick="showDeleteModal(${rowId})"]`,
    );
    if (btn) {
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      btn.disabled = true;
    }

    // Spinner en el botón de confirmar eliminación del modal
    const confirmBtn = document.getElementById("btnConfirmDelete");
    const confirmBtnOriginalText = confirmBtn.innerHTML;
    confirmBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Eliminando...';
    confirmBtn.disabled = true;

    // Guardamos la transacción antes de eliminarla por si quieren deshacer
    lastDeletedTransaction = transactionCache.find((t) => t.rowId === rowId);

    google.script.run
      .withSuccessHandler(() => {
        deleteModal.classList.add("hidden");

        // Restaurar botón del modal
        confirmBtn.innerHTML = confirmBtnOriginalText;
        confirmBtn.disabled = false;

        if (deleteRowId) {
          transactionCache = transactionCache.filter(
            (t) => t.rowId !== deleteRowId,
          );
          sortAndRender();
          loadSummary(true);
        }

        deleteRowId = null;
        showToast("Registro eliminado correctamente", "success");

        // Mostrar y configurar el botón deshacer
        if (fabUndo && lastDeletedTransaction) {
          fabUndo.classList.remove("hidden");
          if (undoTimeout) clearTimeout(undoTimeout);
          undoTimeout = setTimeout(() => {
            fabUndo.classList.add("hidden");
            lastDeletedTransaction = null;
          }, 12000); // 12 seconds to undo
        }
      })
      .withFailureHandler((error) => {
        deleteModal.classList.add("hidden");
        // Restaurar botones
        confirmBtn.innerHTML = confirmBtnOriginalText;
        confirmBtn.disabled = false;
        if (btn) {
          btn.innerHTML = '<i class="fa-solid fa-trash"></i>';
          btn.disabled = false;
        }
        showToast("Error al eliminar: " + error.message, "error");
      })
      .deleteTransaction(rowId);
  }

  window.undoDelete = function () {
    if (!lastDeletedTransaction) return;

    // Ocultar botón inmediatamente
    fabUndo.classList.add("hidden");
    if (undoTimeout) clearTimeout(undoTimeout);

    // Convertir fecha a formato YYYY-MM-DD
    const dateStr = transactionDateToISO(lastDeletedTransaction);

    const txData = {
      date: dateStr,
      amount: lastDeletedTransaction.amount,
      detail: lastDeletedTransaction.detail,
      type: lastDeletedTransaction.type,
      createdAt: lastDeletedTransaction.createdAt,
    };

    const finishUndo = (restoredTransaction) => {
      if (restoredTransaction) {
        transactionCache.unshift(restoredTransaction);
        sortAndRender();
        loadSummary(true);
      } else {
        // Si la fecha no cae en el mes actual simplemente recargamos
        loadTransactions();
      }
      lastDeletedTransaction = null;
      showToast("Acción revertida correctamente", "success");
    };

    google.script.run
      .withSuccessHandler(finishUndo)
      .withFailureHandler((err) => {
        showToast("Error al deshacer: " + err.message, "error");
      })
      .addTransactionOptimized(txData, currentMonth, currentYear);
  };

  function handleFormSubmit(e) {
    e.preventDefault();

    const rawAmount = inputAmount.value;
    const finalAmount = calculateExpression(rawAmount);

    if (finalAmount === null || isNaN(finalAmount)) {
      showToast("Por favor ingrese un monto válido", "error");
      return;
    }

    let amountToSend = finalAmount;
    if (rawAmount.match(/[=+\-*/]/)) {
      if (rawAmount.trim().startsWith("=")) {
        amountToSend = rawAmount.trim();
      } else {
        if (rawAmount.match(/[+\-*/]/)) {
          amountToSend = "=" + rawAmount.trim();
        }
      }
    }

    const txData = {
      date: document.getElementById("inputDate").value,
      amount: amountToSend,
      detail: document.getElementById("inputDetail").value,
      type: inputType.value,
    };

    const rowId = document.getElementById("editRowId").value;

    const submitBtn = document.getElementById("btnSubmit");
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Procesando...';
    submitBtn.disabled = true;

    const finishEdit = (updatedTransaction) => {
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = false;
      addModal.classList.add("hidden");
      addForm.reset();

      // ACTUALIZACIÓN LOCAL: Buscar y reemplazar en el cache
      if (updatedTransaction) {
        const index = transactionCache.findIndex(
          (t) => t.rowId === updatedTransaction.rowId,
        );
        if (index > -1) {
          transactionCache[index] = updatedTransaction;
          sortAndRender();
          loadSummary(true);
        }
      }
      showToast("Cambios guardados correctamente", "success");
    };

    const finishAdd = (newTransaction) => {
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = false;
      addModal.classList.add("hidden");
      addForm.reset();

      if (newTransaction) {
        transactionCache.unshift(newTransaction);
        sortAndRender();
      }
      loadSummary(true);
      showToast("Registro agregado correctamente", "success");
    };

    const handleError = (error) => {
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = false;
      showToast("Error: " + error.message, "error");
    };

    if (editMode && rowId) {
      google.script.run
        .withSuccessHandler(finishEdit)
        .withFailureHandler(handleError)
        .editTransaction(rowId, txData);
    } else {
      google.script.run
        .withSuccessHandler(finishAdd)
        .withFailureHandler(handleError)
        .addTransactionOptimized(txData, currentMonth, currentYear);
    }
  }

  // Dashboard chart instances
  var dashPieIncome = null;
  var dashPieExpense = null;

  function renderSummaryTable(data) {
    const tbodyElement = document.getElementById("summaryTableBody");
    if (!data || data.length === 0) {
      if (tbodyElement) {
        tbodyElement.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-secondary);">No hay datos</td></tr>';
      }
      return;
    }

    registerChartPluginsOnce();
    const isMobileSummary = window.innerWidth <= 768;

    // Extraer años disponibles y renderizar chips
    const years = extractAvailableYears(data);
    if (!summarySelectedYear || !years.includes(summarySelectedYear)) {
      summarySelectedYear = years[0];
    }
    renderYearChips(years);

    // Filtrar datos por año seleccionado
    const yearData = filterDataByYear(data, summarySelectedYear);

    // Calcular y actualizar KPIs
    const kpiTotals = calculateKPIAggregates(yearData);
    updateKPICards(kpiTotals);

    // Obtener colores del tema
    const themeColors = getThemeColors();

    // Renderizar gráficos
    renderPieCharts(kpiTotals, themeColors, isMobileSummary);
    renderMonthlyTrendChart(yearData, themeColors, isMobileSummary);

    // Renderizar tabla de detalle
    const detailRows = calculateDetailRows(yearData);
    const maxBars = calculateMaxBars(detailRows);
    renderDetailStrip(detailRows);
    renderDetailTableRows(detailRows, maxBars);

    // Refrescar stats del header (sin re-renderizar tabla para evitar parpadeo)
    refreshHeaderStatsFromCache();
    setTimeout(renderCharts, 80);
  }

  // ============================================
  // SUMMARY HELPERS (Refactorizado)
  // ============================================

  /**
   * Extrae los años disponibles de los datos del resumen
   */
  function extractAvailableYears(data) {
    const yearsSet = new Set();
    data.forEach((s) => {
      if (!s.monthYear) return;
      const parts = s.monthYear.split(" ");
      if (parts.length >= 2) yearsSet.add(parts[parts.length - 1]);
    });
    return ["Todos"].concat(Array.from(yearsSet).sort().reverse());
  }

  /**
   * Renderiza los chips de selección de año
   */
  function renderYearChips(years) {
    const chipsEl = document.getElementById("summaryYearChips");
    if (!chipsEl) return;

    chipsEl.innerHTML = "";
    const fragment = document.createDocumentFragment();
    years.forEach((yr) => {
      const btn = document.createElement("button");
      btn.className = "year-chip-btn" + (yr === summarySelectedYear ? " active" : "");
      btn.textContent = yr;
      btn.addEventListener("click", () => {
        summarySelectedYear = yr;
        renderSummaryTable(summaries);
      });
      fragment.appendChild(btn);
    });
    chipsEl.appendChild(fragment);
  }

  /**
   * Filtra los datos por año seleccionado
   */
  function filterDataByYear(data, year) {
    if (year === "Todos" || !year) return data;
    return data.filter((s) => s.monthYear && s.monthYear.endsWith(year));
  }

  /**
   * Calcula los agregados KPI de los datos del año
   */
  function calculateKPIAggregates(yearData) {
    let totFreqInc = 0, totNoFreqInc = 0, totFreqExp = 0, totNoFreqExp = 0;
    yearData.forEach((s) => {
      totFreqInc += Number(s.freqIncome) || 0;
      totNoFreqInc += Number(s.nonFreqIncome) || 0;
      totFreqExp += Math.abs(Number(s.freqExpense)) || 0;
      totNoFreqExp += Math.abs(Number(s.nonFreqExpense)) || 0;
    });

    const totIncome = totFreqInc + totNoFreqInc;
    const totExpense = totFreqExp + totNoFreqExp;
    const netBalance = totIncome - totExpense;
    const savingsRate = totIncome > 0 ? Math.round((netBalance / totIncome) * 100) : 0;

    return {
      totFreqInc, totNoFreqInc, totFreqExp, totNoFreqExp,
      totIncome, totExpense, netBalance, savingsRate
    };
  }

  /**
   * Actualiza las tarjetas KPI en el DOM
   */
  function updateKPICards(totals) {
    const { totIncome, totExpense, netBalance, savingsRate } = totals;

    const kpiIncome = document.getElementById("kpiTotalIncome");
    const kpiExpense = document.getElementById("kpiTotalExpense");
    const kpiNet = document.getElementById("kpiNetBalance");
    const kpiSR = document.getElementById("kpiSavingsRate");

    if (kpiIncome) kpiIncome.textContent = "S/ " + totIncome.toFixed(2);
    if (kpiExpense) kpiExpense.textContent = "S/ " + totExpense.toFixed(2);

    if (kpiNet) {
      kpiNet.textContent = (netBalance >= 0 ? "+ " : "- ") + "S/ " + Math.abs(netBalance).toFixed(2);
      kpiNet.style.color = netBalance >= 0 ? "var(--accent-green-readable)" : "var(--accent-red)";
    }

    if (kpiSR) {
      kpiSR.textContent = savingsRate + "%";
      kpiSR.style.color = savingsRate >= 0 ? "var(--accent-yellow)" : "var(--accent-red)";
    }
  }

  /**
   * Obtiene los colores del tema actual
   */
  function getThemeColors() {
    // Opt 3: obtener getComputedStyle una sola vez
    const style = getComputedStyle(document.body);
    const getVar = (name) => style.getPropertyValue(name).trim() || "#fff";
    return {
      textBodyColor: getVar("--text-primary"),
      textMuted: getVar("--text-secondary"),
      dashBg: getVar("--bg-dark"),
      pieBorderColor: getVar("--bg-card"),
      borderColor: getVar("--border-color"),
      borderColorLight: getVar("--border-color-light")
    };
  }

  /**
   * Configuración base para tooltips de gráficos
   */
  function getBaseTooltipConfig(colors, type = "pie") {
    const isLight = colors.dashBg === "#f3f8ef" || colors.dashBg === "#f7faef";
    return {
      backgroundColor: isLight ? "rgba(255,255,255,0.97)" : "rgba(15,17,16,0.97)",
      padding: 12,
      cornerRadius: 8,
      bodyColor: colors.textBodyColor,
      titleColor: colors.textBodyColor,
      borderColor: colors.borderColor,
      borderWidth: 1,
      callbacks: type === "pie" 
        ? { label: (ctx) => ` S/ ${ctx.parsed.toFixed(2)}` }
        : {
            label: (ctx) => ` ${ctx.dataset.label}: S/ ${ctx.parsed.y.toFixed(2)}`,
            labelColor: (ctx) => ({
              borderColor: ctx.dataset.borderColor || ctx.dataset.backgroundColor,
              backgroundColor: ctx.dataset.borderColor || ctx.dataset.backgroundColor,
            }),
          }
    };
  }

  /**
   * Configuración base para leyendas de gráficos
   */
  function getBaseLegendConfig(isMobile, position = "bottom") {
    return {
      position,
      labels: {
        color: getThemeColors().textMuted,
        font: { size: isMobile ? 10 : 11, family: "DM Sans", weight: "700" },
        boxWidth: position === "bottom" ? 10 : 12,
        padding: isMobile ? 8 : 14,
        ...(position === "top" && { usePointStyle: true, pointStyle: "circle" }),
      },
    };
  }

  /**
   * Configuración base para datalabels de gráficos de torta
   */
  function getPieDatalabelsConfig(isMobile) {
    return {
      display: true,
      color: "#E9F2E9",
      formatter: (value, ctx) => {
        const dataArr = ctx.chart.data.datasets[0].data;
        const sum = dataArr.reduce((acc, val) => acc + Number(val), 0);
        if (sum === 0) return "0%";
        const percentage = ((value * 100) / sum).toFixed(1) + "%";
        return value > 0 && (!isMobile || (value * 100) / sum >= 5) ? percentage : "";
      },
      font: { weight: "bold", size: isMobile ? 11 : 13, family: "DM Sans" },
    };
  }

   */

            data: [totFreqExp, totNoFreqExp],
            backgroundColor: ["#FF4D57", "#FFC145"],
            borderColor: colors.pieBorderColor,
            borderWidth: 2,
            hoverOffset: 10,
          }],
        },

          maintainAspectRatio: false,

            legend: getBaseLegendConfig(isMobile),

  /**
   * Renderiza el gráfico de tendencia mensual
   */
  function renderMonthlyTrendChart(yearData, colors, isMobile) {
    const trendCtx = document.getElementById("summaryTrendChart");
    if (!trendCtx) return;

    if (dashTrend) dashTrend.destroy();
    const mLabels = monthNames.map((m) => m.substring(0, 3));

    const expData = new Array(12).fill(0);

    yearData.forEach((s) => {
      const mName = s.monthYear.split(" ")[0].toLowerCase().substring(0, 3);
      // Opt 8: usar mapa precalculado O(1) en lugar de findIndex O(12)
      const idx = MONTH_NAME_TO_INDEX[mName];
      if (idx !== undefined) {
        incData[idx] += (Number(s.freqIncome) || 0) + (Number(s.nonFreqIncome) || 0);
        expData[idx] += Math.abs(Number(s.totalExpense) || 0);
      }
    });

    const netData = incData.map((v, i) => v - expData[i]);

    registerChartPluginsOnce();
    dashTrend = new Chart(trendCtx.getContext("2d"), {
      type: "bar",
      data: {
        labels: mLabels,
        datasets: [
          { label: "Ingresos", data: incData, backgroundColor: "#00D26A", borderRadius: 6, barPercentage: 0.6, order: 2 },

  /**
   * Determina la clase CSS para el color del valor basado en si es 0, positivo o negativo
   * @param {number} value - El valor a evaluar
   * @param {string} type - Tipo de valor: "income", "expense", "net"
   * @returns {string} Clase CSS para el color
   */
  function getValueColorClass(value, type) {
    if (value === 0) return "amount-neutral";
    if (type === "income") return value > 0 ? "amount-positive" : "amount-negative";
    if (type === "expense") return "amount-negative";
    if (type === "net") return value >= 0 ? "amount-positive" : "amount-negative";
    return "amount-neutral";
  }

  /**
   * Calcula las filas de detalle procesadas
   */
  function calculateDetailRows(yearData) {
    return yearData.map((row) => {
      const freqIncome = Number(row.freqIncome) || 0;
      const nonFreqIncome = Number(row.nonFreqIncome) || 0;
      const freqExpense = Math.abs(Number(row.freqExpense) || 0);
      const nonFreqExpense = Math.abs(Number(row.nonFreqExpense) || 0);
      const totalExpense = Math.abs(Number(row.totalExpense) || 0);
      const netMonthly = Number(row.netMonthly) || 0;
      return {
        row, freqIncome, nonFreqIncome, totalIncome: freqIncome + nonFreqIncome,
        freqExpense, nonFreqExpense, totalExpense, netMonthly,
      };
    });
  }

  /**
   * Calcula los valores máximos para las barras de progreso
   */
  function calculateMaxBars(detailRows) {
    return detailRows.reduce(
      (max, item) => ({
        freqIncome: Math.max(max.freqIncome, item.freqIncome),
        nonFreqIncome: Math.max(max.nonFreqIncome, item.nonFreqIncome),
        freqExpense: Math.max(max.freqExpense, item.freqExpense),
        nonFreqExpense: Math.max(max.nonFreqExpense, item.nonFreqExpense),
        totalExpense: Math.max(max.totalExpense, item.totalExpense),
        netMonthly: Math.max(max.netMonthly, Math.abs(item.netMonthly)),
      }),
      { freqIncome: 0, nonFreqIncome: 0, freqExpense: 0, nonFreqExpense: 0, totalExpense: 0, netMonthly: 0 },
    );
  }

  /**
   * Renderiza el strip de resumen (mini cards)
   */
  function renderDetailStrip(detailRows) {
    const detailStrip = document.getElementById("detailSummaryStrip");
    if (!detailStrip) return;

    // Opt 7: un solo reduce en lugar de 6 iteraciones independientes
    const stats = detailRows.reduce((acc, item) => {
      // Acumular totales
      acc.totalIncome += item.totalIncome;
      acc.totalExpense += item.totalExpense;
      acc.totalNet += item.netMonthly;

      // Encontrar extremos
      if (!acc.topIncome || item.totalIncome > acc.topIncome.totalIncome) acc.topIncome = item;
      if (!acc.topExpense || item.totalExpense > acc.topExpense.totalExpense) acc.topExpense = item;
      if (!acc.bestNet || item.netMonthly > acc.bestNet.netMonthly) acc.bestNet = item;
      if (!acc.worstNet || item.netMonthly < acc.worstNet.netMonthly) acc.worstNet = item;

      return acc;
    }, {
      totalIncome: 0, totalExpense: 0, totalNet: 0,
      topIncome: null, topExpense: null, bestNet: null, worstNet: null
    });

    const count = detailRows.length;
    const avgIncome = count ? stats.totalIncome / count : 0;
    const avgExpense = count ? stats.totalExpense / count : 0;
    const avgNet = count ? stats.totalNet / count : 0;
    const savingsRate = stats.totalIncome > 0 ? Math.round((stats.totalNet / stats.totalIncome) * 100) : 0;

    const { topIncome, topExpense, bestNet, worstNet } = stats;

    detailStrip.innerHTML = `
      <div class="detail-mini-card detail-mini-period">
        <span class="detail-mini-label">Periodo</span>
        <strong>${detailRows.length} meses</strong>
        <small class="detail-mini-note">${summarySelectedYear || "Todos"}</small>
      </div>
      <div class="detail-mini-card detail-mini-income">
        <span class="detail-mini-label">Ingreso prom.</span>
        <strong class="${getValueColorClass(avgIncome, "income")}">${formatMoney(avgIncome)}</strong>
        <small class="detail-mini-note">por mes</small>
      </div>
      <div class="detail-mini-card detail-mini-expense">
        <span class="detail-mini-label">Gasto prom.</span>
        <strong class="${getValueColorClass(avgExpense, "expense")}">${formatMoney(-avgExpense)}</strong>
        <small class="detail-mini-note">por mes</small>
      </div>
      <div class="detail-mini-card detail-mini-net">
        <span class="detail-mini-label">Neto prom.</span>
        <strong class="${getValueColorClass(avgNet, "net")}">${formatMoney(avgNet)}</strong>
        <small class="detail-mini-note">${savingsRate}% ahorro</small>
      </div>
      <div class="detail-mini-card detail-mini-income">
        <span class="detail-mini-label">Mayor ingreso</span>
        <strong>${topIncome ? topIncome.row.monthYear : "-"}</strong>
        <small class="detail-mini-note ${topIncome && topIncome.totalIncome === 0 ? "amount-neutral" : ""}">${topIncome ? formatMoney(topIncome.totalIncome) : "-"}</small>
      </div>
      <div class="detail-mini-card detail-mini-expense">
        <span class="detail-mini-label">Mayor gasto</span>
        <strong>${topExpense ? topExpense.row.monthYear : "-"}</strong>
        <small class="detail-mini-note ${topExpense && topExpense.totalExpense === 0 ? "amount-neutral" : ""}">${topExpense ? formatMoney(-topExpense.totalExpense) : "-"}</small>
      </div>
      <div class="detail-mini-card detail-mini-net">
        <span class="detail-mini-label">Mejor neto</span>
        <strong>${bestNet ? bestNet.row.monthYear : "-"}</strong>
        <small class="detail-mini-note ${bestNet && bestNet.netMonthly === 0 ? "amount-neutral" : ""}">${bestNet ? formatMoney(bestNet.netMonthly) : "-"}</small>
      </div>
      <div class="detail-mini-card detail-mini-risk">
        <span class="detail-mini-label">Neto más bajo</span>
        <strong>${worstNet ? worstNet.row.monthYear : "-"}</strong>
        <small class="detail-mini-note ${worstNet && worstNet.netMonthly === 0 ? "amount-neutral" : ""}">${worstNet ? formatMoney(worstNet.netMonthly) : "-"}</small>
      </div>
    `;
  }

  /**
   * Renderiza las filas de la tabla de detalle mensual
   */
  function renderDetailTableRows(detailRows, maxBars) {
    const tbody = document.getElementById("summaryTableBody");
    if (!tbody) return;

    tbody.innerHTML = "";
    const fragment = document.createDocumentFragment();
    const pct = (value, max) => max ? Math.min(100, (Math.abs(Number(value) || 0) / max) * 100) : 0;

    let previousYear = "";
    detailRows.forEach((item) => {
      const { row } = item;
      const [monthName, rowYear = ""] = String(row.monthYear || "").split(" ");
      const isYearBreak = rowYear && previousYear && rowYear !== previousYear;
      previousYear = rowYear || previousYear;

      const tr = document.createElement("tr");
      if (isYearBreak) tr.classList.add("summary-year-break");
      tr.innerHTML = `
        <td>
          <span class="summary-month">
            <strong>${monthName || row.monthYear}</strong>
            <small>${rowYear}</small>
          </span>
        </td>
        <td class="${getValueColorClass(item.freqIncome, "income")} summary-data-cell summary-income-freq" style="--bar:${pct(item.freqIncome, maxBars.freqIncome).toFixed(1)}%;">
          <span class="summary-data-bar"></span>
          <span class="summary-data-value">${formatMoney(row.freqIncome)}</span>
        </td>
        <td class="${getValueColorClass(item.nonFreqIncome, "income")} summary-data-cell summary-income-extra" style="--bar:${pct(item.nonFreqIncome, maxBars.nonFreqIncome).toFixed(1)}%;">
          <span class="summary-data-bar"></span>
          <span class="summary-data-value">${formatMoney(row.nonFreqIncome)}</span>
        </td>
        <td class="${getValueColorClass(item.freqExpense, "expense")} summary-data-cell summary-expense-freq" style="--bar:${pct(item.freqExpense, maxBars.freqExpense).toFixed(1)}%;">
          <span class="summary-data-bar"></span>
          <span class="summary-data-value">${formatMoney(row.freqExpense)}</span>
        </td>
        <td class="${getValueColorClass(item.nonFreqExpense, "expense")} summary-data-cell summary-expense-extra" style="--bar:${pct(item.nonFreqExpense, maxBars.nonFreqExpense).toFixed(1)}%;">
          <span class="summary-data-bar"></span>
          <span class="summary-data-value">${formatMoney(row.nonFreqExpense)}</span>
        </td>
        <td class="${getValueColorClass(item.totalExpense, "expense")} summary-data-cell summary-expense-total" style="--bar:${pct(item.totalExpense, maxBars.totalExpense).toFixed(1)}%;">
          <span class="summary-data-bar"></span>
          <span class="summary-data-value">${formatMoney(row.totalExpense)}</span>
        </td>
        <td class="${getValueColorClass(item.netMonthly, "net")} summary-data-cell ${item.netMonthly >= 0 ? "summary-net-positive" : "summary-net-negative"}" style="--bar:${pct(item.netMonthly, maxBars.netMonthly).toFixed(1)}%;">
          <span class="summary-data-bar"></span>
          <span class="summary-data-value">${formatMoney(row.netMonthly)}</span>
        </td>
      `;
      fragment.appendChild(tr);
    });
    tbody.appendChild(fragment);
  }

  // ============================================
  // INTERANNUAL CHART HELPERS (Refactorizado)
  // ============================================

  /**
   * Construye los datos por año para los gráficos interanuales
   */
  function buildInterannualData(metric) {
    const yearsData = {}, incomeData = {}, expenseData = {};
    const allYears = new Set();

    summaries.forEach((s) => {
      if (!s.monthYear) return;
      const parts = s.monthYear.split(" ");
      if (parts.length < 2) return;
      const mName = parts[0], yearStr = parts[parts.length - 1];
      if (!yearStr.match(/^\d{4}$/)) return;
      // Opt 8: usar mapa precalculado O(1) en lugar de findIndex O(12)
      const mIdx = MONTH_NAME_TO_INDEX[mName.toLowerCase().substring(0, 3)];
      if (mIdx === undefined) return;

      allYears.add(yearStr);
      if (!yearsData[yearStr]) yearsData[yearStr] = new Array(12).fill(0);
      if (!incomeData[yearStr]) incomeData[yearStr] = new Array(12).fill(0);
      if (!expenseData[yearStr]) expenseData[yearStr] = new Array(12).fill(0);

      incomeData[yearStr][mIdx] = (Number(s.freqIncome) || 0) + (Number(s.nonFreqIncome) || 0);
      expenseData[yearStr][mIdx] = Math.abs(Number(s.totalExpense) || 0);

      const metrics = {
        totalExpense: Math.abs(Number(s.totalExpense)),
        freqExpense: Math.abs(Number(s.freqExpense)),
        nonFreqExpense: Math.abs(Number(s.nonFreqExpense)),
        totalIncome: incomeData[yearStr][mIdx],
        freqIncome: Number(s.freqIncome) || 0,
        nonFreqIncome: Number(s.nonFreqIncome) || 0,
        netMonthly: Number(s.netMonthly) || 0,
      };
      yearsData[yearStr][mIdx] = metrics[metric] ?? 0;
    });

    return { yearsData, incomeData, expenseData, allYears: Array.from(allYears).sort() };
  }

  /**
   * Construye datasets para el modo comparación (ingresos vs gastos)
   */
  function buildComparisonDatasets(summarySelectedYear, sortedYears, incomeData, expenseData, isMobile) {
    const datasets = [];

    if (summarySelectedYear === "Todos" || !summarySelectedYear) {
      const yearlyIncomes = sortedYears.map((yr) => incomeData[yr].reduce((a, b) => a + b, 0));
      const yearlyExpenses = sortedYears.map((yr) => expenseData[yr].reduce((a, b) => a + b, 0));
      const yearlyNets = yearlyIncomes.map((inc, i) => inc - yearlyExpenses[i]);

      datasets.push({
        label: "Ingresos Totales", data: yearlyIncomes,
        backgroundColor: "#00D26A", borderColor: "#00D26A", borderWidth: 1, borderRadius: 4, order: 2,
        maxBarThickness: isMobile ? 18 : 55,
      });
      datasets.push({
        label: "Gastos Totales", data: yearlyExpenses.map((v) => -v),
        backgroundColor: "#FF4D57", borderColor: "#FF4D57", borderWidth: 1, borderRadius: 4, order: 2,
        maxBarThickness: isMobile ? 18 : 55,
      });
      datasets.push({
        label: "Balance Neto", data: yearlyNets, type: "line",
        borderColor: "#2D9CDB", backgroundColor: "rgba(45,156,219,0.20)",
        borderWidth: 3, pointRadius: 5, pointBackgroundColor: "#2D9CDB", tension: 0.4, fill: true, order: 1,
      });
    } else {
      const yr = summarySelectedYear;
      if (sortedYears.includes(yr)) {
        datasets.push({
          label: `Ingresos ${yr}`, data: incomeData[yr],
          backgroundColor: "#00D26A", borderColor: "#00D26A", borderWidth: 1, borderRadius: 4, order: 2,
          maxBarThickness: isMobile ? 10 : 40,
        });
        datasets.push({
          label: `Gastos ${yr}`, data: expenseData[yr].map((v) => -v),
          backgroundColor: "#FF4D57", borderColor: "#FF4D57", borderWidth: 1, borderRadius: 4, order: 2,
          maxBarThickness: isMobile ? 10 : 40,
        });
        const netVals = incomeData[yr].map((v, j) => v - expenseData[yr][j]);
        datasets.push({
          label: `Neto ${yr}`, data: netVals, type: "line",
          borderColor: "#2D9CDB", backgroundColor: "rgba(45,156,219,0.20)",
          borderWidth: 3, pointRadius: 5, pointBackgroundColor: "#2D9CDB", tension: 0.4, fill: true, order: 1,
        });
      }
    }

    return datasets;
  }

  /**
   * Construye datasets para métricas específicas (un serie por año)
   */
  function buildMetricDatasets(metric, summarySelectedYear, sortedYears, yearsData, isMobile) {
    const palette = [
      { main: "#2D9CDB", light: "#78C6EF" },
      { main: "#00D26A", light: "#70E7AA" },
      { main: "#FF4D57", light: "#FF9AA0" },
      { main: "#FFC145", light: "#FFD98A" },
      { main: "#A855F7", light: "#C99CFF" },
      { main: "#FF8A00", light: "#FFB35C" },
    ];

    const metricColors = {
      totalExpense: palette[2], freqExpense: palette[2], nonFreqExpense: palette[3],
      totalIncome: palette[1], freqIncome: palette[0], nonFreqIncome: palette[4], netMonthly: palette[5],
    };

    const datasets = [];
    sortedYears.forEach((yr, i) => {
      const isHighlighted = summarySelectedYear === "Todos" || summarySelectedYear === yr;
      let c;
      if (summarySelectedYear === "Todos") {
        c = sortedYears.length === 1 ? metricColors[metric] || palette[0] : palette[i % palette.length];
      } else {
        c = isHighlighted ? metricColors[metric] || palette[0] : { main: "#56645e" };
      }
      datasets.push({
        label: yr, data: yearsData[yr], type: "bar",
        backgroundColor: isHighlighted ? c.main : c.main + "40",
        borderColor: c.main, borderWidth: isHighlighted ? 1.5 : 0, borderRadius: 4,
        barPercentage: isMobile ? 0.52 : 0.7, categoryPercentage: isMobile ? 0.64 : 0.8,
        maxBarThickness: isMobile ? 9 : 36,
      });
    });

    return datasets;
  }

  /**
   * Calcula el ancho requerido para el gráfico
   */
  function calculateChartWidth(metric, summarySelectedYear, sortedYears, dataLen, barsPerLabel, isMobile, viewportW) {
    const mobileBaseW = Math.max(viewportW - 44, 320);
    let requiredW;

    if (metric === "comparison" && (summarySelectedYear === "Todos" || !summarySelectedYear)) {
      requiredW = isMobile ? Math.max(mobileBaseW, sortedYears.length * 74) : Math.max(420, sortedYears.length * 130);
    } else if (metric === "comparison") {
      requiredW = isMobile ? Math.max(mobileBaseW, dataLen * barsPerLabel * 13 + 58) : Math.max(620, dataLen * barsPerLabel * 40 + 100);
    } else {
      requiredW = isMobile ? Math.max(mobileBaseW, dataLen * barsPerLabel * 9 + 64) : Math.max(720, dataLen * barsPerLabel * 34 + 120);
    }

    return { requiredW, mobileBaseW };
  }

  /**
   * Construye el contenedor HTML del gráfico
   */
  function buildChartContainer(chartTitle, isMobile, requiredW, mobileBaseW) {
    const containerH = isMobile ? 324 : 370;
    const innerStyle = isMobile
      ? `position:relative; height:${containerH}px; min-width:${requiredW}px; width:${requiredW}px;`
      : `position:relative; height:${containerH}px; width:100%;`;

    return `
      ${isMobile ? `
        <div class="chart-mobile-head">
          <div>
            <span class="chart-mobile-kicker">Comparativa</span>
            <h4>${chartTitle}</h4>
          </div>
          ${requiredW > mobileBaseW + 8 ? '<span class="chart-swipe-hint"><i class="fa-solid fa-arrows-left-right"></i> Desliza</span>' : ""}
        </div>` : ""
      }
      <div class="chart-scroll-wrapper">
        <div id="annualChartInner" style="${innerStyle}">
          <canvas id="annualChart"></canvas>
        </div>
      </div>`;
  }

  /**
   * Obtiene las opciones del gráfico interanual
   */
  function getInterannualChartOptions(metric, chartTitle, isMobile, themeColors) {
    const isLight = currentTheme === "light";
    return {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: { top: isMobile ? 18 : 42, bottom: isMobile ? 4 : 28, left: isMobile ? 0 : 10, right: isMobile ? 2 : 10 },
      },
      plugins: {
        chartLabelGuidePlugin: {
          enabled: !isMobile,
          color: isLight ? "rgba(17,20,17,0.34)" : "rgba(247,248,244,0.38)",
          labelBg: isLight ? "rgba(255,255,255,0.92)" : "rgba(2,4,3,0.78)",
          labelBorder: isLight ? "rgba(0,0,0,0.10)" : "rgba(255,255,255,0.10)",
          labelColor: isLight ? "#111411" : "#f7f8f4",
          elbowLength: 6,
        },
        legend: {
          display: true, position: "top", align: isMobile ? "start" : "center",
          labels: {
            color: themeColors.textMuted, usePointStyle: true, pointStyle: "circle",
            font: { size: isMobile ? 10 : 12, family: "DM Sans", weight: "700" },
            padding: isMobile ? 8 : 15, boxWidth: 8,
          },
        },
        title: {
          display: !isMobile, text: chartTitle, color: themeColors.textBodyColor,
          align: "center", font: { size: 18, weight: "700", family: "DM Sans" }, padding: { bottom: 24 },
        },
        tooltip: {
          backgroundColor: isLight ? "rgba(255,255,255,0.95)" : "rgba(15,17,16,0.95)",
          titleColor: themeColors.textBodyColor, bodyColor: themeColors.textMuted,
          borderColor: themeColors.borderColor, borderWidth: 1, padding: 12, cornerRadius: 8,
          callbacks: { label: (ctx) => ` ${ctx.dataset.label}: S/ ${Math.abs(ctx.parsed.y).toFixed(2)}` },
        },
        datalabels: {
          display: false, anchor: "end",
          align: (ctx) => Number(ctx.dataset.data[ctx.dataIndex]) >= 0 ? "top" : "bottom",
          offset: (ctx) => getChartLabelLane(ctx.chart, ctx.datasetIndex).offset,
          color: isLight ? "#111411" : "#f7f8f4",
          backgroundColor: isLight ? "rgba(255,255,255,0.92)" : "rgba(2,4,3,0.78)",
          borderColor: isLight ? "rgba(0,0,0,0.10)" : "rgba(255,255,255,0.10)",
          borderWidth: 1, borderRadius: 3,
          padding: { top: 3, right: 5, bottom: 3, left: 5 },
          font: { size: 11, weight: "800", family: "Segoe UI, Arial, sans-serif" },
          formatter: (v) => `${Number(v) < 0 ? "-" : ""}S/${Math.abs(Number(v) || 0).toFixed(0)}`,
          rotation: 0, textAlign: "center", clamp: true, clip: true,
        },
      },
      scales: {
        y: {
          beginAtZero: true,
          grid: { color: themeColors.borderColorLight, drawBorder: false },
          ticks: {
            color: themeColors.textMuted, font: { size: isMobile ? 8 : 11, family: "DM Sans" },
            maxTicksLimit: isMobile ? 5 : 8,
            callback: (v) => "S/" + (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(1) + "k" : Math.abs(v)),
          },
        },
        x: {
          grid: { display: false },
          ticks: {
            color: themeColors.textMuted, autoSkip: false, maxRotation: 0, minRotation: 0,
            font: { size: isMobile ? 9 : 11, family: "DM Sans", weight: isMobile ? "700" : "500" },
          },
        },
      },
      interaction: { mode: "index", intersect: false },
      animation: { duration: 1000, easing: "easeOutQuart" },
    };
  }

  // ============================================
  // THEME LOGIC
  // ============================================
  function initTheme() {
    if (currentTheme === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }

  function toggleTheme() {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    localStorage.setItem("bucks_theme", currentTheme);

    initTheme();

    // Re-render charts so they pick up new CSS variables
    if (document.getElementById("view-summary").classList.contains("active")) {
      renderSummaryTable(summaries);
    }
  }

  // ============================================
  // FREQ INCOME LOGIC
  // ============================================
  window.openFreqIncomeModal = function () {
    const currMonthYearStr = monthNames[currentMonth] + " " + currentYear;
    freqIncomeMonthLabel.textContent = `(${currMonthYearStr})`;

    let currentVal = 0;
    if (summaries && summaries.length > 0) {
      const summaryRow = summaries.find(
        (s) => s.monthYear === currMonthYearStr,
      );
      if (summaryRow) currentVal = Number(summaryRow.freqIncome) || 0;
    }

    inputFreqIncomeAmount.value = currentVal.toFixed(2);
    freqIncomeModal.classList.remove("hidden");
  };

  function handleFreqIncomeSubmit(e) {
    e.preventDefault();

    const amount = Number(inputFreqIncomeAmount.value);
    if (isNaN(amount) || amount < 0) {
      showToast("Ingrese un monto válido referencialmente", "error");
      return;
    }

    const currMonthYearStr = monthNames[currentMonth] + " " + currentYear;

    const submitBtn = document.getElementById("btnSaveFreqIncome");
    const ogText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    submitBtn.disabled = true;

    google.script.run
      .withSuccessHandler((res) => {
        submitBtn.innerHTML = ogText;
        submitBtn.disabled = false;
        freqIncomeModal.classList.add("hidden");

        // Optimizacion: actualizar array local summaries inmediatamente
        if (summaries) {
          const row = summaries.find((s) => s.monthYear === currMonthYearStr);
          if (row) {
            row.freqIncome = amount;
            // force re-calc local fields
            row.totalIncome = amount + Number(row.nonFreqIncome);
            row.netMonthly = row.totalIncome + Number(row.totalExpense);
          }
        }

        showToast(res.message || "Actualizado correctamente", "success");
        renderSummaryTable(summaries); // Refresca y trigger sortAndRender headers
      })
      .withFailureHandler((err) => {
        submitBtn.innerHTML = ogText;
        submitBtn.disabled = false;
        showToast("Error: " + err.message, "error");
      })
      .updateFreqIncome(currMonthYearStr, amount);
  }

  // ============================================
  // CHARTS - INTERANUAL
  // ============================================
  function renderCharts() {
    const chartContainer = document.getElementById("interannualChartContainer");
    if (!chartContainer) return;
    if (!summaries || summaries.length === 0) return;

    const metric = currentChartMetric || "comparison";
    const isMobile = window.innerWidth <= 768;
    const viewportW = Math.max(window.innerWidth || 390, 320);

    // Construir datos por año
    const { yearsData, incomeData, expenseData, allYears: sortedYears } = buildInterannualData(metric);

    // Determinar labels y datasets según la métrica
    let mLabels = monthNames.map((m) => m.substring(0, 3));
    let datasets;

    if (metric === "comparison") {
      if (summarySelectedYear === "Todos" || !summarySelectedYear) {
        mLabels = sortedYears.slice();
      }
      datasets = buildComparisonDatasets(summarySelectedYear, sortedYears, incomeData, expenseData, isMobile);
    } else {
      datasets = buildMetricDatasets(metric, summarySelectedYear, sortedYears, yearsData, isMobile);
    }

    // Destruir gráfico anterior
    if (myChart) { myChart.destroy(); myChart = null; }

    // Títulos según métrica
    const titles = {
      comparison: "Comparativa de ingresos vs gastos por año",
      totalExpense: "Comparativa de gastos totales por año",
      freqExpense: "Comparativa de Gasto Frecuente por año",
      nonFreqExpense: "Comparativa de Gasto No Frecuente por año",
      totalIncome: "Comparativa de ingresos totales por año",
      freqIncome: "Comparativa de Ingreso Frecuente por año",
      nonFreqIncome: "Comparativa de Ingreso No Frecuente por año",
      netMonthly: "Evolución del balance neto anual",
    };

    const chartTitle = (titles[metric] || "Gráfico") +
      (summarySelectedYear && summarySelectedYear !== "Todos" ? ` (${summarySelectedYear})` : "");

    // Calcular dimensiones
    const dataLen = mLabels.length || 1;
    const barsPerLabel = datasets.filter((d) => d.type === "bar" || !d.type).length || 1;
    const { requiredW, mobileBaseW } = calculateChartWidth(metric, summarySelectedYear, sortedYears, dataLen, barsPerLabel, isMobile, viewportW);

    // Construir contenedor
    chartContainer.innerHTML = buildChartContainer(chartTitle, isMobile, requiredW, mobileBaseW);

    // Crear gráfico
    const canvas = document.getElementById("annualChart");
    registerChartPluginsOnce();
    const themeColors = getThemeColors();

    myChart = new Chart(canvas.getContext("2d"), {
      type: "bar",
      data: { labels: mLabels, datasets },
      options: getInterannualChartOptions(metric, chartTitle, isMobile, themeColors),
    });
  }
</script>
